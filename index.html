<!-- REAL RAZORPAY PAYMENT -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<button id="pay-btn" style="width:100%;padding:16px;background:#00ff88;color:#000;border:0;border-radius:30px;font-weight:900;font-size:17px;margin:20px 0;">₹100 Pay & Unlock Video</button>
<div id="videoBox" style="display:none">
  <h2>✅ Payment Success</h2>
  <iframe src="YOUR_VIDEO_LINK" style="width:100%;height:220px;border:0;border-radius:12px"></iframe>
</div>

<script>
const BACKEND = "https://viewpoint-pay-backend.onrender.com";
document.getElementById('pay-btn').onclick = async () => {
  const r1 = await fetch(BACKEND+'/api/create-order',{method:'POST'});
  const d1 = await r1.json();
  var opt = {
    key: "rzp_test_TbZAlloBgol1LS",
    amount: d1.order.amount, currency:"INR",
    name:"Viewpoint", description:"Video Access",
    order_id: d1.order.id,
    handler: async function(res){
      const vr = await fetch(BACKEND+'/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(res)});
      const vd = await vr.json();
      if(vd.success){
        localStorage.setItem('vp_paid','true');
        document.getElementById('videoBox').style.display='block';
        alert('Payment Verified ✅');
      } else alert('Verification failed ❌');
    },
    theme:{color:"#070707"}
  };
  new Razorpay(opt).open();
};
if(localStorage.getItem('vp_paid')==='true') document.getElementById('videoBox').style.display='block';
</script>
