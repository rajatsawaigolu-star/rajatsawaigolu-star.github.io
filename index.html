<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Video - ₹100</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#070707;color:#fff;font-family:Arial;text-align:center}
.wrap{max-width:380px;margin:0 auto;padding:16px}
.banner{width:100%;height:240px;background:#111;border-radius:16px;overflow:hidden;border:1px solid #222;margin:15px 0}
.banner img{width:100%;height:100%;object-fit:cover}
.price{font-size:40px;font-weight:900;color:#00ff88;margin:10px 0}
.pay-btn{width:100%;padding:18px;background:#00ff88;color:#000;border:0;border-radius:12px;font-size:18px;font-weight:800}
#videoBox{display:none;margin-top:15px} #videoBox iframe{width:100%;height:220px;border-radius:12px;border:0}
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div class="wrap">
<div class="banner"><img id="bannerImg" src="https://via.placeholder.com/380x240"></div>
<div class="price" id="priceText">₹10</div>
<p id="titleText">Pay to unlock full video</p>
<button class="pay-btn" id="payBtn">Pay with GPay / PhonePe</button>
<div id="videoBox"><iframe id="videoFrame" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe></div>
<p style="margin-top:20px"><a href="admin.html" style="color:#666">Admin Panel</a></p>
</div>

<script>
const BACKEND="https://viewpoint-pay-backend.onrender.com";
const data = JSON.parse(localStorage.getItem("vp_data")) || {title:"My Exclusive Video", price:10, banner:"https://via.placeholder.com/380x240", video:"https://www.youtube.com/embed/dQw4w9WgXcQ"};
document.getElementById("titleText").innerText=data.title;
document.getElementById("priceText").innerText="₹"+data.price;
document.getElementById("payBtn").innerText="Pay ₹"+data.price+" with GPay";
document.getElementById("bannerImg").src=data.banner;
document.getElementById("videoFrame").src=data.video;

document.getElementById("payBtn").onclick = async function(){
  const btn=this; btn.innerText="Wait..."; 
  const d1 = await fetch(BACKEND+'/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:data.price})}).then(r=>r.json());
if(vd.success){ 
  localStorage.setItem('vp_paid','true'); 
  document.getElementById('payBtn').style.display='none';
  document.getElementById('titleText').innerText="YOUR VIDEO IS READY ❤️";
  document.getElementById('priceText').style.display='none';
  document.getElementById('videoBox').style.display='block'; 
  alert('Payment Verified ✅ Video Unlocked!'); 
}
  var opt={key:"rzp_test_TbZAlIoBgol1LS", amount:d1.amount, currency:"INR", name:data.title, order_id:d1.id,
  handler: async function(res){
    const vr = await fetch(BACKEND+'/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(res)});
    const vd = await vr.json();
    
    else alert('Failed ❌');
  }, theme:{color:"#070707"}};
  new Razorpay(opt).open(); btn.innerText="Pay ₹"+data.price;
};
if(localStorage.getItem('vp_paid')==='true') document.getElementById('videoBox').style.display='block';
</script>
</body>
</html>
